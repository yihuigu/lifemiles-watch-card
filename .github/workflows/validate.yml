name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: plugin
          # Skipped on purpose: only a listing in HACS's default store needs these, and this
          # repo is installed as a custom repository. No licence is the owner's call; no topics
          # keeps the repo out of GitHub's topic pages and search results (low profile).
          ignore: license topics
